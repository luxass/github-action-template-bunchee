ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

onlyBuiltDependencies:
  - "@swc/core"
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0

catalogs:
  runtime:
    "@actions/core": 3.0.1

  dev:
    bunchee: 7.0.2
    oxfmt: 0.76.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
    typescript: 6.0.3

  types:
    "@types/node": 26.6.6
